name: AegisForge CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: AegisForge
          environment-file: environment.yml
          auto-activate-base: false
          auto-update-conda: true
      - name: Install locked Python dependencies in AegisForge
        run: python -m pip install -r backend/requirements-dev.lock
      - name: Check backend, migrations and frozen dataset
        run: python scripts/check.py --backend-only

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  controlled-validation:
    name: Controlled Docker regressions (development only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: AegisForge
          environment-file: environment.yml
          auto-activate-base: false
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python scripts/build_validator.py
      - run: python scripts/repair_smoke.py controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-controlled-summary
          path: data/m4-controls-*/summary.json
