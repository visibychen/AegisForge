name: AegisForge CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: AegisForge
          environment-file: environment.yml
          auto-activate-base: false
          auto-update-conda: true
      - name: Install locked Python dependencies in AegisForge
        run: python -m pip install -r backend/requirements-dev.lock
      - name: Check backend, migrations and frozen dataset
        run: python scripts/check.py --backend-only

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  controlled-validation:
    name: Controlled Docker regressions (development only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: AegisForge
          environment-file: environment.yml
          auto-activate-base: false
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python scripts/build_validator.py
      - run: python scripts/repair_smoke.py controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-controlled-summary
          path: data/m4-controls-*/summary.json

  m6-controls:
    name: M6 registered holdout controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AEGISFORGE_DEEPSEEK_API_KEY: ''
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: AegisForge
          environment-file: environment.yml
          auto-activate-base: false
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python scripts/build_validator.py
      - run: python scripts/m6_validate.py controls
      - run: python scripts/resource_probes.py
      # The committed candidate bundle is required (a deleted file fails here, it is never skipped).
      # Real containers re-execute all 54 frozen candidates. Exit 2 = incomplete or environment
      # error, 3 = a verdict differs from the committed record, 1 only with --require-threshold.
      # Whether the course threshold is met is the separate, strict m6-acceptance job.
      - name: Re-execute all 54 frozen candidates and compare with the committed record
        run: >
          python scripts/m6_validate.py candidates
          --bundle evaluation/results/m6-baseline-candidates.json
          --compare evaluation/results/m6-repairs-baseline.json
          --output data/m6-repairs-ci.json
      - name: Diagnose later candidates separately from formal acceptance
        run: >
          python scripts/m6_validate.py diagnostics
          --bundle evaluation/results/m6-posthoc-candidates.json
          --output data/m6-posthoc-repairs-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-controlled-evidence
          retention-days: 30
          path: |
            data/m6-controls-ci.json
            data/m6-resources-ci.json
            data/m6-repairs-ci.json
            data/m6-posthoc-repairs-ci.json

  m6-records:
    name: M6 record integrity (recomputed, no thresholds)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AEGISFORGE_DEEPSEEK_API_KEY: ''
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: AegisForge
          environment-file: environment.yml
          auto-activate-base: false
      - run: python -m pip install -r backend/requirements-dev.lock
      # Exit 1 if a baseline file is missing or altered, or a count/flag differs from the numbers
      # recomputed from its raw rows. A truthful record of unmet thresholds passes this job.
      - run: python scripts/m6_freeze_guard.py
      - run: python scripts/m6_verify.py --output data/m6-records-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-record-integrity
          retention-days: 30
          path: data/m6-records-ci.json

  m6-acceptance:
    name: M6 strict numeric acceptance (manual; fails until the thresholds are met)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AEGISFORGE_DEEPSEEK_API_KEY: ''
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: AegisForge
          environment-file: environment.yml
          auto-activate-base: false
      - run: python -m pip install -r backend/requirements-dev.lock
      # Exit 0 only if every threshold is met on recomputed numbers; 1 = valid record, not met;
      # 2 = invalid record. No continue-on-error, no default pull-request gate.
      - run: python scripts/acceptance.py --output data/m6-acceptance-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-acceptance
          retention-days: 30
          path: data/m6-acceptance-ci.json

  workbench-e2e:
    name: Workbench Compose E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AEGISFORGE_MODEL_MODE: fake
      AEGISFORGE_DEEPSEEK_API_KEY: ''
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: AegisForge
          environment-file: environment.yml
          auto-activate-base: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: npm --prefix frontend ci
      - name: Pull verified Playwright image with browsers and OS dependencies
        timeout-minutes: 8
        run: python scripts/ci_workbench.py --pull-browser-image
      - run: python scripts/ci_workbench.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-workbench-evidence
          retention-days: 7
          path: |
            frontend/test-results/evidence/*.png
            data/m4-isolation.json
            data/m5-e2e-summary.json
            data/m5-e2e-report.json
            data/m5-ci-services.log
