name: AegisForge CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: AegisForge
          environment-file: environment.yml
          auto-activate-base: false
          auto-update-conda: true
      - name: Install locked Python dependencies in AegisForge
        run: python -m pip install -r backend/requirements-dev.lock
      - name: Check backend, migrations and frozen dataset
        run: python scripts/check.py --backend-only

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  controlled-validation:
    name: Controlled Docker regressions (development only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: AegisForge
          environment-file: environment.yml
          auto-activate-base: false
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python scripts/build_validator.py
      - run: python scripts/repair_smoke.py controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-controlled-summary
          path: data/m4-controls-*/summary.json

  m6-controls:
    name: M6 registered holdout controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AEGISFORGE_DEEPSEEK_API_KEY: ''
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: AegisForge
          environment-file: environment.yml
          auto-activate-base: false
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python scripts/build_validator.py
      - run: python scripts/m6_validate.py controls
      - run: python scripts/resource_probes.py
      - name: Validate all frozen first candidates when available
        if: hashFiles('evaluation/results/m6-baseline-candidates.json') != ''
        run: python scripts/m6_validate.py candidates --bundle evaluation/results/m6-baseline-candidates.json --output data/m6-repairs-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-controlled-evidence
          retention-days: 30
          path: |
            data/m6-controls-ci.json
            data/m6-resources-ci.json
            data/m6-repairs-ci.json

  workbench-e2e:
    name: Workbench Compose E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AEGISFORGE_MODEL_MODE: fake
      AEGISFORGE_DEEPSEEK_API_KEY: ''
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: AegisForge
          environment-file: environment.yml
          auto-activate-base: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: npm --prefix frontend ci
      - run: npx playwright install --with-deps chromium firefox
        working-directory: frontend
      - run: python scripts/ci_workbench.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-workbench-evidence
          retention-days: 7
          path: |
            frontend/test-results/*.png
            data/m4-isolation.json
            data/m5-e2e-summary.json
            data/m5-e2e-report.json
            data/m5-ci-services.log
